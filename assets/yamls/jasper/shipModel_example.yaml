general:
  mode: silsim
model:
  adb_path: "src/submodules/BechamoCppUnitTestData/alookup/Jasper/Jasper.json"
  mass_path: "src/submodules/BechamoCppUnitTestData/alookup/Jasper/Jasper_mass.json"
initialization:
  start_in_air: false
  initial_latitude: 0.752469612
  initial_longitude: -1.3778938
  initial_heading: 0.0
  initial_altitude: 0.0
  initial_ground: -1.0
  termination_altitude: -0.05
  launcher_takeoff: false
  launcher_pitch: 30.0

  #   UNIMPLEMENTED SHIP PARAMS
  #   params.initLat
  #   params.initLon
  #   params.pN_init
  #   params.pE_init
  #   params.pD_init

  #   Determines if the ship motion block is run and connected to other
  #   blocks during the simulation.
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    false
  enable_ship_motion: true

  #   The path of the *.coderdata file containing ship motion data. If set to
  #   "", ship motion module will output constant data.
  #
  #   Type:       string
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  ship_motion_data_path: "src/submodules/BechamoShipModelsLib/shipData/shipMotion/SCONE_D3H_5.coderdata"

  #   Seconds in the future to query ship motion data file. Overridden by 
  #   random value if 'ship_motion_time_shift_seed' is non-negative.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0, 1750]
  #   Default:    0
  ship_motion_time_shift: 0.0
  
  #   Sets the seed that will randomize 'ship_motion_time_shift' upon init. If
  #   negative, the time shift is not randomized.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    -1
  ship_motion_time_shift_seed: -1

  #   The minimum time remaining in the ship motion dataset as a result of the
  #   'ship_motion_time_shift_seed' randomization. For example, if the 'min_data_span' is 
  #   30s, and the range of times available in the ship motion dataset is 0s 
  #   to 120s, the range of acceptable 'ship_motion_min_data_span' values are 0s to 90s.
  #
  #   WARNING: This assumes the data set is from 0s to 1800s, there is no check
  #   to see if it is otherwise.
  #   
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [50, 1750]
  #   Default:    60
  ship_motion_min_data_span: 60

  #   The direction of the ship's motion. This will rotate the ship data output
  #   such that the mean direction of ship travel is in the direction of 
  #   ship_course. This also rotates the ship airwake data to align with
  #   the ship's motion.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      radians
  #   Range:      [0, 6.283185307]
  #   Default:    0
  ship_course: 0.0

  #   Determines if the ship airwake block is run and connected to other
  #   blocks during the simulation. Ship airwake depends on ship motion;
  #   if enable_ship_motion == false, then ship airwake is disabled
  #   regardless of this variable.
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    false
  enable_ship_airwake: true

  #   The path of the *.bin file containing ship airwake data. If set to
  #   "", ship airwake module will output constant data.
  #
  #   Type:       string
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  ship_airwake_data_path: "src/submodules/BechamoShipModelsLib/shipData/shipAirwake/25kt090deg_0000_6000.bin"

  #   The average speed of the ship. Used in transformation of airwake
  #   speed to global frame.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      m/s
  #   Range:      [0.0, 20.0]
  #   Default:    0.0
  ship_airwake_ship_speed: 0.0

  #   Seconds in the future to query ship airwake data file. Overridden
  #   by random value if 'ship_airwake_time_shift_seed' is non-negative.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      n/a
  #   Range:      [0.0, 60.0]
  #   Default:    0.0
  ship_airwake_time_shift: 0.0

  #   Sets the seed that will randomize 'ship_airwake_time_shift' upon init. If
  #   negative, the time shift is not randomized.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    -1
  ship_airwake_time_shift_seed: -1


