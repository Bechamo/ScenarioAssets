  #   Range:           [DEFAULT, CESSNA, TILTWING, LINCOLN_ACTOR]
  #   Default:         DEFAULT
  aircraft_actor: DEFAULT

  #   [Experimental, Unfinished]
  #      The UDP port to send visualization data to. The visualization engine must
  #      be listening on this port. No effect if visualization is inactive.
  #
  #   Required for:    none
  #   Type:            int
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         49000
  vis_port: 49000

  #   [Experimental, Unfinished]
  #     The rate at which to send visualization data to the visualization engine
  #     over UDP. No effect if visualization is inactive.
  #
  #   Required for:    none
  #   Type:            int
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         0
  vis_rate: 0

#
# logging
#
logging:
  #   [Not implemented yet] 
  #       Controls how often to log to the console. A value of 0 disables
  #       console logging; a value of N will log every N timesteps.
  #
  #   Required for:    mode=ALL, takeoff_type=ALL
  #   Type:            int
  #   Units:           iterations
  #   Range:           [0, inf)
  #   Default:         1
  logging_interval: 1

#
# weather
#
weather:
  #   Turbulence level generated by the wind model.
  #
  #   Required for:    mode=ALL, takeoff_type=ALL
  #   Type:            enum
  #   Units:           n/a
  #   Range:           [NONE, LIGHT, MODERATE, SEVERE]
  #   Default:         LIGHT
  turbulence: LIGHT

  #   Speed of the generated wind.
  #
  #   Required for:    mode=ALL, takeoff_type=ALL
  #   Type:            double
  #   Units:           m/s
  #   Range:           [0.0, inf)
  #   Default:         5.0
  wind_speed: 5.0

  #   The direction of the generated wind.
  #
  #   Required for:    mode=ALL, takeoff_type=ALL
  #   Type:            double
  #   Units:           rad
  #   Range:           [-6.2831853071795, 6.2831853071795]
  #   Default:         0.0
  wind_direction: 0.0

  #   Sets the temperature in Celsius.
  #
  #   Required for:    mode=ALL, takeoff_type=ALL
  #   Type:            double
  #   Units:           C
  #   Range:           n/a
  #   Default:         15.0
  temperature: 15.0

#
# mavlink
#
mavlink:
  #   Automatically disarm the vehicle at the end of the simulation.
  #   Disarm happens before log, mission, or parameter downloads. Applicable
  #   only when a MAVLink-enabled device or vehicle is connected.
  #
  #   Required for:    none
  #   Type:            bool
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         true
  auto_disarm: true

  #   Automatically reboot the vehicle at the end of the simulation.
  #   Reboot happens after log, mission, or parameter downloads.
  #
  #   Required for:    none
  #   Type:            bool
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         true
  auto_reboot: true

  #   Automatically download the log file from the vehicle at the end
  #   of the simulation. Applicable only when a MAVLink-enabled device is connected.
  #
  #   Required for:    none
  #   Type:            bool
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         true
  auto_download_log: true

  #   Automatically download the parameter file from the vehicle at
  #   the end of the simulation.
  #
  #   Required for:    none
  #   Type:            bool
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         true
  auto_download_parameters: true

  #   Automatically download the mission file from the vehicle at
  #   the end of the simulation.
  #
  #   Required for:    none
  #   Type:            bool
  #   Units:           n/a
  #   Range:           n/a
  #   Default:         true
  auto_download_mission: true

#
# controller
#
controller:
  #   The ratio of physics timesteps to controller calculations. A value of 1
  #   updates the controller every physics step; larger values update less often.
  #
  #   Required for:    mode=ALL, takeoff_type=ALL
  #   Type:            int
  #   Units:           timesteps
  #   Range:           [1, inf)
  #   Default:         1
  ratio: 1

#
# mission
#
mission:
  #   In the absence of waypoints, the default target airspeed for the controller
  #   to strive towards. Applicable to the Jasper controller.
  #
  #   Required for:    none
  #   Type:            double
  #   Units:           m/s
  #   Range:           [1.0, inf)
  #   Default:         38.0
  target_airspeed: 38.0

  #   In the absence of waypoints, the default target altitude for the controller
  #   to strive towards. Applicable to the Jasper controller.
  #
  #   Required for:    none
  #   Type:            double
  #   Units:           m
  #   Range:           [1.0, inf)
  #   Default:         40.0
  target_altitude: 40.0

