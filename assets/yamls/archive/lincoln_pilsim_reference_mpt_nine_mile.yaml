####
#
#   This is a reference file for the settings available to Clarkesim. This
#   file should NOT be edited. Instead, create your own settings file based
#   on this one.
#
####


#
# general
#
general:
  #   This specifies the mode that the simulation should run in. The available
  #   options are:
  #       - silsim
  #           Run software-in-the-loop simulation on the host computer only. In
  #           this most, physics simulations and the controller are both run in
  #           a deterministic, linear fashion.
  #
  #       - pilsim
  #           Run processor-in-the-loop simulation between the host computer and
  #           an embedded device. The host computer maintains a physical world
  #           and model of the vehicle, and informs the embedded device about
  #           its environment. The embedded device runs the controller and
  #           informs the host about vehicle commands
  #
  #       - px4 [Experimental]
  #           Connect to a running PX4 silsim instance and supply
  #           physics data.
  #
  #       - hilsim
  #           Send sensor hilsim data to a device that emulates sensor
  #           signals to an autopilot
  #
  #   Type:       string
  #   Required:   yes
  #   Units:      n/a
  #   Range:      [silsim, pilsim, px4, hilsim]
  #   Default:    n/a
  mode: pilsim

#
# model
#
model:
  #   Path to ADB json file to be loaded into the sixdof module.
  #
  #   Type:       string
  #   Required:   yes
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    n/a
  adb_path: "./src/submodules/BechamoSimLib/lincoln/adb/lincoln.json"

  #   Path to aircraft mass file to be loaded into the sixdof module.
  #
  #   Type:       string
  #   Required:   yes
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    n/a
  mass_path: "./src/submodules/BechamoSimLib/lincoln/adb/lincoln_mass.json"

#
# initialization
#
initialization:
  # Experimental
  #   If true, this settings causes the plane to be initialized in the air
  #   instead of on the ground. This should generally be avoided if takeoff
  #   is available.
  #
  #   Type:       boolean
  #   Required:   no
  #   Units:      meters
  #   Range:      n/a
  #   Default:    false
  start_in_air: false

  #   Start the vehicle at this latitude, in radians
  #
  #   Type:       double
  #   Required:   no
  #   Units:      radians
  #   Range:      [-1.4835298642, 1.4835298642]
  #   Default:    0.752469612git st
  initial_latitude: 0.526499163749

  #   Start the vehicle at this longitude, in radians
  #
  #   Type:       double
  #   Required:   no
  #   Units:      radians
  #   Range:      [-pi, pi]
  #   Default:    -1.3778938
  initial_longitude: -1.790351241779

  #   The initial heading for the vehicle, in radians. This is the direction the
  #   vehicle will initially face
  #
  #   Type:       double
  #   Required:   no
  #   Units:      radians
  #   Range:      [-2*pi, 2*pi]
  #   Default:    0.0
  initial_heading: 0.0

  #   The altitude to start the vehicle at. This applies regardless of whether or
  #   not the plane is initialized in the air
  #
  #   Type:       double
  #   Required:   no
  #   Units:      meters
  #   Range:      [0, 20000]
  #   Default:    0.0
  initial_altitude: 1014.0

  #   The initial altitude of the ground. If this is < 0, it will be the same
  #   as the initial_altitude
  #
  #   Type:       double
  #   Required:   no
  #   Units:      meters
  #   Range:      [-1, 20000]
  #   Default:    -1.0
  initial_ground: -1.0

  #   altitude for the simulation to terminate. If this is equal to -0.05, it will be the same
  #   as the initial_ground
  #
  #   Type:       double
  #   Required:   no
  #   Units:      meters
  #   Range:      [-2000, 20000]
  #   Default:    -0.05
  termination_altitude: -1.0

  #   If this is true, the simulation will use a rail launcher for takeoff.
  #   Otherwise, it will use runway takeoff
  #
  #   Type:       boolean
  #   Required:   no
  #   Units:      n/a
  #   Range:      [true, false]
  #   Default:    false
  #   Modes:      all
  launcher_takeoff: true

  #   Denotes the type of takeoff action to simulate
  #
  #   Type:       enum
  #   Required:   yes
  #   Units:      n/a
  #   Range:      [RUNWAY, LAUNCHER, VTOL, INAIR, SIMPLE_VTOL, SHIP_VTOL, RATO]
  #   Default:    RUNWAY
  #   Modes:      all
  takeoff_type: RATO

  #   Pitch angle of the plane on the launcher
  #
  #   Type:       double
  #   Required:   no
  #   Units:      degrees
  #   Range:      [0.0, 40.0]
  #   Default:    30.0
  #   Modes:      all
  launcher_pitch: 19.0


#
# timing
#
timing:
  #   The maximum time that the simulation should run for. If running
  #   hardware-in-the-loop, this is real-time. Otherwise, this is likely faster
  #   than real time, but is constrained by the resources of the host computer
  #
  #   If this is 0, the simulation will run forever
  #
  #   Type:       int
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0, inf)
  #   Default:    0
  max_time: 0

  #   Number of times per second to update the physics. Actual rate is best
  #   effort with available resources
  #
  #   IMPORTANT: this is used in silsim to determine the timestep (dt) of the
  #   physics models
  #
  #   Type:       int
  #   Required:   no
  #   Units:      hertz
  #   Range:      [1, inf)
  #   Default:    125
  #   Modes:      pilsim, hilsim, silsim*
  frequency: 100

  #   The amount of time to spend initializing the simulation state. This helps
  #   to remove ambiguity from sensor and physics models. Applicable only to
  #   hardware-in-the-loop simulation
  #
  #   Type:       int
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0, inf)
  #   Default:    2
  init_time: 0

  #   Airspeed time-to-live. After this many seconds:
  #     - Stop sending airspeed in HIL_SENSOR MAVLink messages
  #     - Stop sending airspeed data to the hilsim hardware
  #
  #   The emulated sensor will repeatedly send the most recent data when it
  #   stops receiving new data
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0.0, inf)
  #   Default:    0.0
  #   Modes:      pilsim, hilsim
  airspeed_ttl: 0.0

  #   Airspeed Sensor maximum range, limits the simulation's airspeed sensor.
  #
  #   A value of -1.0 will ignore this feature
  # 
  #   Type:       double
  #   Required:   no
  #   Units:      Pa
  #   Range:      [0.0, inf)
  #   Default:    0.0
  #   Modes:      pilsim, hilsim
  airspeed_sensor_gain_threshold: 1500.0

  #   GPS time-to-live. After this many seconds, stop sending GPS data to the
  #   test unit in hilsim, or HIL_GPS messages in pilsim
  #
  #   A value of 0.0 will never 'kill' the GPS data.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0.0, inf)
  #   Default:    0.0
  #   Modes:      pilsim, hilsim
  gps_ttl: 0.0

  #   During hardware-in-the-loop and processor-in-the-loop simulation, tell
  #   the connected MAVLink device to start the mission at this time.
  #
  #   If the vehicle is unable to arm or takeoff, a message will be printed to
  #   the console, and a retry will NOT be attempted.
  #
  #   A value of 0 means that Clarkesim will never start the mission
  #   automatically.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0, inf)
  #   Default:    0
  mission_start_time: 0.0

  #   If this is true and the simulation can't set the scheduling policy to
  #   real-time, the user will be informed on the console and the program
  #   will wait for input. 
  #
  #   Type:       boolean
  #   Required:   no
  #   Units:      n/a
  #   Range:      [true, false]
  #   Default:    false
  #   Modes:      all
  real_time_alert: false

  #   Time to wait between mission_start_time and launching the plane. If
  #   mission_start_time is 0, this is the time since sim start.
  #   
  #   A value of 0 allows the plane to use runway takeoff.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0, inf)
  #   Default:    0
  #   Modes:      all
  launcher_timeout: 0.0

#
# tuning
#
tuning:
  # Experimental, Developer Only
  #   Whether or not inputs to and outputs from blocks of the simulation are
  #   normalized [-1, 1]
  #
  #   This MUST be true for pilsim and px4 simulations, but may be false for silsim
  #
  #   Type:       boolean
  #   Required:   no
  #   Units:      n/a
  #   Range:      [true, false]
  #   Default:    true
  #   Modes:      px4, pilsim, silsim
  normalized_surfaces: true

#
# silsim
#
silsim:
  #   Whether or not to run software-in-the-loop simulation in real time
  #
  #   Type:       boolean
  #   Required:   no
  #   Units:      n/a
  #   Range:      [true, false]
  #   Default:    false
  #   Modes:      silsim
  real_time: false
  #   Path to mission plan file
  #
  #   Type:       string
  #   Required:   only if "run_mission_from_file" is true
  #   Default:    ""
  mission_path: ""

#
# Error Injection
#
#error_injection:
  # When running the silsim errors can be injected into the FCL input data to see how the FCL will react
  # This could be used to determine what the FCL will do with faulty or non-existent gps,nav,mag, or state data
  #
  #


#
# pilsim
#
pilsim:
  #   A MAVLink-enabled device to connect to for hardware-in-the-loop
  #   simulations.
  #
  #   Multiple device connections are not supported. Ensure that there are not
  #   multiple MAVLink devices connected at the time of running.
  #
  #   Type:       string
  #   Required:   in hilsim and pilsim mode
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    /dev/serial/by-id/usb-CubePilot_CubeOrange_0-if00
  #   Modes:      pilsim, hilsim
  connection: "/dev/serial/by-id/usb-Auterion_PX4_FMU_v6X.x_0-if00"

  #   The connection string to a MAVLink device that Clarkesim will send
  #   hil_state_quaternion MAVLink messages to
  #
  #   Type:       string
  #   Required:   only if quaternion_rate > 0
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    n/a
  #   Modes:      pilsim
  quaternion_receiver: "serial:///dev/ttyACM0:500000"

  #   The rate at which to send HIL_STATE_QUATERNION messages from the
  #   simulator. Limited by the available resources of the host computer.
  #   Can't be faster than the simulation frequency.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    0
  #   Modes:      pilsim
  quaternion_rate: 0

  #   The system ID of the system that's accepting HIL_STATE_QUATERNION messages.
  #   Applicable only if 'send_hil_quat' is true. This should be a unique system
  #   ID that's shared only between the simulator and the companion computer. If
  #   this ID is found to conflict with another system ID that the simulator is
  #   using, an alert will be shown and the program will stop.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      n/a
  #   Range:      [1, inf)
  #   Default:    2
  #   Modes:      pilsim
  quaternion_sys_id: 2

  #   Set the component ID for the simulator on the 'quaternion_sys_id' system.
  #   Applicable only if 'send_hil_quat' is true
  #
  #   Type:       int
  #   Required:   no
  #   Units:      n/a
  #   Range:      [1, inf)
  #   Default:    3
  #   Modes:      pilsim
  quaternion_comp_id: 3

  # Experimental
  #   The UDP IP and port to connect to QGroundControl from Clarkesim. No effect
  #   if 'qgc_bridge' is false
  #
  #   Type:       string
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    udp:///127.0.0.1:14550
  #   Modes:      pilsim
  qgc_connection: "udp:///127.0.0.1:14550"

  # Experimental
  #   Whether or not to forward messages to/from the QGroundControl connection
  #   to/from other connected MAVLink devices. No effect if 'qgc_bridge' is false
  #
  #   Type:       boolean
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    true
  #   Modes:      pilsim
  qgc_forwarding: true

  #   Whether or not to use Clarkesim as a communication bridge between PX4
  #   and QGroundControl
  #
  #   Type:       boolean
  #   Required:   nostart launch 
  #   Range:      n/a
  #   Default:    false
  #   Modes:      pilsim, hilsim
  qgc_bridge: false

  #   The rate at which to send HIL_SENSOR MAVLink messages to a running PX4
  #   instance. If this is zero, the message will not be sent. Can't be
  #   faster than the simulation frequency.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      hz
  #   Range:      [0, inf)
  #   Default:    125
  #   Modes:      px4, pilsim
  hil_sensor_rate: 125

  #   The rate at which to send HIL_GPS MAVLink messages to a running PX4
  #   instance. If this is zero, the message will not be sent. Can't be
  #   faster than the simulation frequency.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      hz
  #   Range:      [0, inf)
  #   Default:    15
  #   Modes:      px4, pilsim
  hil_gps_rate: 15

 #   The rate at which to send HIL_ENGINE MAVLink messages to a running PX4
  #   instance. If this is zero, the message will not be sent. Can't be
  #   faster than the simulation frequency.
  #
  #   Type:       int
  #   Required:   no
  #   Units:      hz
  #   Range:      [0, inf)
  #   Default:    15
  #   Modes:      
  hil_engine_rate: 15

sensors:
  #   Random noise seed.
  #
  #   Type:       int
  #   Required:   yes
  #   Range:      [0, 100]
  #   Default:    10
  #   Modes:   
  random_noise_seed: 10
  
  #   gps error model on or off
  #
  #   Type:       bool
  #   Required:   no
  #   Default:    true
  #   Modes:
  gps_err_model: true

  #   accelerometer drift, const offset and white noise
  #
  #   Type:       bool
  #   Required:   no
  #   Default:    true
  #   Modes:
  accel_bias_drift: true
  accel_bias_const_offset: false
  accel_white_noise: true

  #   gyroscope drift, const offset and white noise
  #
  #   Type:       bool
  #   Required:   no
  #   Default:    true
  #   Modes:
  gyro_bias_drift: false
  gyro_bias_const_offset: false
  gyro_white_noise: false

  #   magnetometer drift, const offset and white noise
  #
  #   Type:       bool
  #   Required:   no
  #   Default:    true
  #   Modes:
  mag_bias_drift: false
  mag_bias_const_offset: false
  mag_white_noise: true

  #   dynamic pressure drift, const offset and white noise
  #
  #   Type:       bool
  #   Required:   no
  #   Default:    true
  #   Modes:
  dynamic_pressure_bias_drift: true
  dynamic_pressure_bias_const_offset: false
  dynamic_pressure_white_noise: true

#
# enav
#
enav:
  #   Toggle sending external navigation data at this interval, in seconds. A
  #   value of 0 means not to toggle external navigation data. In that case,
  #   data will be sent or not sent based on the enav_send_state_rate
  #   setting. If enav_send_state_rate is 0, this setting has no effect
  #
  #   Type:       int
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0, inf)
  #   Default:    0
  enav_cycle: 0

  #   When enav is being toggled, start with sending (true) or not sending
  #   (false) enav. Has no effect if enav is not sent or enav is not toggled
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    true
  start_with_enav: true

  #   The rate at which to send external navigation data to a running PX4
  #   instance.  If this is zero, the message will not be sent
  #
  #   Type:       int
  #   Required:   no
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    0
  #   Modes:      px4, pilsim
  enav_send_state_rate: 0

  #   ENAV_SEND_STATE time-to-live. After this many seconds, stop sending
  #   ENAV_SEND_STATE MAVLink messages.
  #
  #   A value of 0.0 will never 'kill' the ENAV_SEND_STATE MAVLink message.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0.0, inf)
  #   Default:    0.0
  #   Modes:      pilsim, hilsim
  enav_send_state_ttl: 0.0

  #   After this many seconds, set the enav_status member to the value
  #   specified by updated_status.
  #
  #   If the time is 0.0, enav_status will always be set to initial_status
  #   specified below.
  #
  #   Type:       double
  #   Required:   no
  #   Units:      seconds
  #   Range:      [0.0, inf)
  #   Default:    0.0
  #   Modes:      pilsim, hilsim
  status_time: 0.0

  #   The first status to set in the enav_status member of ENAV_SEND_STATE
  #   MAVLink messages.
  #
  #   MUST be one of the following:
  #     ENAV_STATUS_ALL_INVALID (0)
  #     ENAV_STATUS_ATT (1)
  #     ENAV_STATUS_ATT_POS (2)
  #     ENAV_STATUS_ATT_POS_DR (3)
  #     ENAV_STATUS_ATT_COURSE (4)
  #
  #   Type:       int
  #   Required:   if enav_send_state_rate > 0
  #   Units:      n/a
  #   Range:      [0, 1, 2, 3, 4]
  #   Default:    0
  #   Modes:      pilsim, hilsim
  initial_status: 0

  #   Update the enav_status member of ENAV_SEND_STATE to this when the time
  #   specified above is reached AND is non-zero.
  #
  #   MUST be one of the following:
  #     ENAV_STATUS_ALL_INVALID (0)
  #     ENAV_STATUS_ATT (1)
  #     ENAV_STATUS_ATT_POS (2)
  #     ENAV_STATUS_ATT_POS_DR (3)
  #     ENAV_STATUS_ATT_COURSE (4)
  #
  #   Type:       int
  #   Required:   if status_time > 0.0
  #   Units:      n/a
  #   Range:      [0, 1, 2, 3, 4]
  #   Default:    0
  #   Modes:      pilsim, hilsim
  updated_status: 0


#
# hilsim
#
hilsim:
  #   The device to which to send NMEA GPS sentences
  #
  #   Type:       string
  #   Required:   if mode == 'hilsim'
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  #   Modes:      hilsim
  connection: ""

  #   The device to which to send emulated airspeed data. If this is empty
  #   and hilsim.airspeed_rate is > 0, an error will be thrown.
  #
  #   Type:       string
  #   Required:   if mode == 'hilsim'
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  #   Modes:      hilsim
  airspeed_connection: ""

  #   The device to which to send emulated baro data. If this is empty
  #   and hilsim.baro_rate is > 0, an error will be thrown.
  #
  #   Type:       string
  #   Required:   if mode == 'hilsim'
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  #   Modes:      hilsim
  baro_connection: ""

  #   The device to which to send emulated imu data. If this is empty
  #   and hilsim.imu_rate is > 0, an error will be thrown.
  #
  #   Type:       string
  #   Required:   if mode == 'hilsim'
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  #   Modes:      hilsim
  imu_connection: ""

  #   The device to which to send emulated mag data. If this is empty
  #   and hilsim.mag_rate is > 0, an error will be thrown.
  #
  #   Type:       string
  #   Required:   if mode == 'hilsim'
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  #   Modes:      hilsim
  mag_connection: ""

  #   The device to which to send emulated gps data. If this is empty
  #   and hilsim.gps_rate is > 0, an error will be thrown.
  #
  #   Type:       string
  #   Required:   if mode == 'hilsim'
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    ""
  #   Modes:      hilsim
  gps_connection: ""

  #   The rate at which to send airspeed data to the hilsim hardware
  #
  #   Type:       int
  #   Required:   if mode == 'hilsim'
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    20
  #   Modes:      hilsim
  airspeed_rate: 20

  #   The rate at which to send magnetometer data to the hilsim hardware.
  #   If this is 0, data will not be sent
  #
  #   Type:       int
  #   Required:   if mode == 'hilsim'
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    75
  #   Modes:      hilsim
  mag_rate: 75

  #   The rate at which to send gps data to the hilsim hardware. If this is
  #   0, data will not be sent
  #
  #   Type:       int
  #   Required:   if mode == 'hilsim'
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    20
  #   Modes:      hilsim
  gps_rate: 20

  #   The rate at which to send IMU data to the hilsim hardware. If this is
  #   0, data will not be sent
  #
  #   Type:       int
  #   Required:   if mode == 'hilsim'
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    100
  #   Modes:      hilsim
  imu_rate: 100

  #   The rate at which to send barometer data to the hilsim hardware. If
  #   this is 0, data will not be sent
  # 
  #   [[ UNIMPLEMENTED ]]
  #
  #   Type:       int
  #   Required:   if mode == 'hilsim'
  #   Units:      hertz
  #   Range:      [0, inf)
  #   Default:    10
  #   Modes:      hilsim
  baro_rate: 10



  #   If true, use HIL_ACTUATOR_CONTROLS MAVLink messages for servo feedback
  #   instead of position feedback.
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      [true, false]
  #   Default:    false
  #   Modes:      hilsim
  use_mavlink: false

#
# visualization
#
visualization:
  # Experimental, Unfinished
  #   The UDP port to send visualization data to. The visualization engine must
  #   be listening on this port. No effect if 'visualize' is false
  vis_port: 49000

  # Experimental, Unfinished
  #   The rate at which to send visualization data to the visualization engine
  #   over UDP. No effect if 'visualize' is false
  vis_rate: 0

#
# logging
#
logging:
  # NOT IN USE. WILL HAVE NO EFFECT. NOT PARSED.
  #   The directory to save log data to. This is relative to the directory where
  #   executable is being run. If this directory does not exist, it will be
  #   created.
  #
  #   Type:       string
  #   Required:   no
  #   Units:      n/a
  #   Range:      n/a
  #   Default:    logs/
  #   Modes:      px4, pilsim, silsim
  # logdir: "logs/"

  #   Controls how often to log to the console. That is, Clarkesim will output
  #   every time this many iterations has run. e.g., a value of 5 will print
  #   every 5 timesteps.
  #
  #   A value of 0 disables console logging
  #
  #   Type:       int
  #   Required:   no
  #   Units:      n/a
  #   Range:      [0, inf)
  #   Default:    1
  #   Modes:      silsim
  logging_interval: 1

#
# weather
#
weather:
  #   Control the turbulence generated by the wind model
  #
  #   Type:       string
  #   Required:   no
  #   Units:      n/a
  #   Range:      [NONE, LIGHT, MODERATE, SEVERE]
  #   Default:    LIGHT
  #   Modes:      px4, pilsim, silsim
  turbulence: "LIGHT"

  #   Control the speed of the generated wind
  #
  #   Type:       double
  #   Required:   no
  #   Units:      m/s
  #   Range:      [0.0, inf)
  #   Default:    5.0
  #   Modes:      px4, pilsim, silsim
  wind_speed: 5.0

  #   Control the direction of the generated wind
  #
  #   Type:       double
  #   Required:   no
  #   Units:      rad
  #   Range:      [-2*pi, 2*pi]
  #   Default:    0.0
  #   Modes:      px4, pilsim, silsim
  wind_direction: 0.0

  #   Sets the day temperature in Celsius
  #
  #   Type:       double
  #   Required:   no
  #   Units:      degrees celcius
  #   Range:      (-inf, inf)
  #   Default:    15.0
  temperature: 15.0


#
# mavlink
#
mavlink:
  #   If true, automatically disarm the vehicle at the end of the simulation.
  #   Disarm happens before log, mission, or parameter downloads
  #
  #   Applicable only when a MAVLink-enabled device or vehicle is connected
  #   during simulation
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      [false, true]
  #   Default:    true
  #   Modes:      pilsim, hilsim*
  auto_disarm: true

  #   If true, automatically reboot the vehicle at the end of the simulation.
  #   Reboot happens after log, mission, or parameter downloads
  #
  #   Applicable only when a MAVLink-enabled device or vehicle is connected
  #   during simulation
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      [false, true]
  #   Default:    true
  #   Modes:      pilsim, hilsim*
  auto_reboot: true

  #   If true, automatically download the log file from the vehicle at the end
  #   of the simulation
  #
  #   Applicable only when a MAVLink-enabled device or vehicle is connected
  #   during simulation
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      [false, true]
  #   Default:    true
  #   Modes:      pilsim, hilsim*
  auto_download_log: true

  #   If true, automatically download the parameter file from the vehicle at
  #   the end of the simulation
  #
  #   Applicable only when a MAVLink-enabled device or vehicle is connected
  #   during simulation
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      [false, true]
  #   Default:    true
  #   Modes:      pilsim, hilsim*
  auto_download_parameters: true

  #   If true, automatically download the mission file from the vehicle at
  #   the end of the simulation
  #
  #   Applicable only when a MAVLink-enabled device or vehicle is connected
  #   during simulation
  #
  #   Type:       bool
  #   Required:   no
  #   Units:      n/a
  #   Range:      [false, true]
  #   Default:    true
  #   Modes:      pilsim, hilsim*
  auto_download_mission: true

  #   A set of MAVLink commands (NOT messages!) to send during simulation.
  #   This setting is a list of messages which specify their IDs, parameters,
  #   and the time at which they should be sent.
  #
  #   If a message ID is not valid, it will not be sent.
  #   If a send_time is 0.0, it will not be sent
  #
  #   https://mavlink.io/en/messages/common.html#mav_commands
  #
  commands:
    -
      command: 0
      param1: 0.0
      param2: 0.0
      param3: 0.0
      param4: 0.0
      param5: 0.0
      param6: 0.0
      param7: 0.0
      send_time: 0.0


####
#   Controller settings
####
controller:

  #
  # controller > timing
  #
  timing:
    #   The ratio of physics timesteps to controller calculations. For
    #   example, a value of 1 will update the controller every time the physics
    #   are updated. A value of 5 will update the controller every 5th time the
    #   physics are updated. Applicable only to software in the loop
    #
    #   Type:       int
    #   Required:   if 'mode' == silsim, yes. otherwise, no
    #   Units:      N/A
    #   Range:      [1, inf)
    #   Default:    5
    #   Modes:      silsim
    ratio: 1


####
#   Mission settings
####
mission:

  #
  # mission > targets
  #
  targets:
    #   In the absense of waypoints, the default target airspeed for the controller
    #   to strive towards. Applicable only to the Jasper controller.
    #
    #   Type:       double
    #   Required:   no
    #   Units:      m/s
    #   Range:      [1, inf) (bound by aircraft physics)
    #   Default:    38.0
    #   Modes:      silsim
    target_airspeed: 38.0

    #   In the absense of waypoints, the default target altitude for the controller
    #   to strive towards. Applicable only to the Jasper controller.
    #
    #   Type:       double
    #   Required:   no
    #   Units:      meters
    #   Range:      [1, inf) (bound by aircraft physics)
    #   Default:    40.0
    #   Modes:      silsim
    target_altitude: 40.0
