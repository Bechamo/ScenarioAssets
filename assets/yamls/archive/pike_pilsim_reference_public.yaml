# @brief      Configuration for the Iron Bird Proccessor in the loop Simulation
###############################################################################

##################
# section: general
##################
general:
  #   This specifies the mode that the simulation should run in. The available
  #   options are:
  #       - pilsim
  #           Run processor-in-the-loop simulation between the host computer and
  #           an embedded device. The host computer maintains a physical world
  #           and model of the vehicle, and informs the embedded device about
  #           its environment. The embedded device runs the controller and
  #           informs the host about vehicle commands
  mode: pilsim

################
# section: model
################
model:
  #   Description: Path to aircraft mass file.
  #   Default:     "mass.json" (relative location of provided mass.json file)
  mass_path: "src/submodules/BechamoSimLib/pike/adb/pike_mass.json"

#########################
# section: initialization
#########################
initialization:
  #   Description: Start the vehicle at this latitude in radians.
  #                Must match takeoff location in uploaded mission
  #   Units:       radians
  #   Range:       [-1.4835298642, 1.4835298642]
  #   Default:     0.75053289 (from demonstration)
  initial_latitude: 0.75053289

  #   Description: Start the vehicle at this longitude in radians.
  #                Must match takeoff location in uploaded mission
  #   Units:       radians
  #   Range:       [-pi, pi]
  #   Default:     -1.3778938 (from demonstration)
  initial_longitude: -1.375334622

  #   Description: The initial heading for the vehicle, in radians. 
  #                This is the direction thevehicle will initially face.
  #   Units:       radians
  #   Range:       [-2*pi, 2*pi]
  #   Default:     0.0 (from demonstration)
  initial_heading: 0.0

  #   Description: Starting altitide of the vehicle.
  #   Units:       meters
  #   Range:       [0, 20000]
  #   Default:     100.0 (from demonstration)
  initial_altitude: 0.0

  #   Description: The initial altitude of the ground.
  #                values of <0> or lower will be set to initial_altitude
  #   Units:       meters
  #   Range:       [-1, 20000]
  #   Default:     -1.0
  initial_ground: -1.0

  #   Description: altitude for the simulation to terminate.
  #   Units:       meters
  #   Range:       [-2000, 20000]
  #   Default:     -0.05
  termination_altitude: -0.05

#################
# section: timing
#################
timing:
  #   Description: The maximum time that the simulation should run
  #                value of <0> causes simulation to run indefinitely.
  #   Units:      seconds
  #   Range:      [0, inf)
  #   Default:    0 (indefinite)
  max_time: 0

  #   Description: Number of times per second to update the physics.
  #                Rate is best effort with available resources
  #   Units:       hertz
  #   Range:       [1, inf)
  #   Default:     125
  frequency: 100

  #   Description: Time spent initializing the simulation state. 
  #                Higher values remove ambiguity from sensor and physics models.
  #   Units:       seconds
  #   Range:       [0, inf)
  #   Default:     2
  init_time: 0

  #   Description: GPS time-to-live. After this many seconds, stop sending HIL_GPS messages over MAVLINK
  #                A value of <0.0> will indefinitely sent GPS data.
  #   Units:       seconds
  #   Range:       [0.0, inf)
  #   Default:     0.0
  gps_ttl: 0.0

#################
# section: pilsim
#################
pilsim:
  #   Description: A MAVLink-enabled device to connect to for proccessor-in-the-loop simulations.
  #                Multiple device connections are not supported. 
  #   Default:     "/dev/serial/by-id/usb-ARK_ARK_FMU_v6X.x_0-if00" (corresponding to the ARK board)
  connection: "/dev/serial/by-id/usb-ARK_ARK_FMU_v6X.x_0-if00"

  #   Description: Connection to a MAVLink device that will recieve
  #                hil_state_quaternion MAVLink messages
  #   Default:    "serial:///dev/ttyACM0:500000" (corresponding to the ARK board)
  quaternion_receiver: "serial:///dev/ttyACM0:500000"

  #   Description: The rate at which to send HIL_STATE_QUATERNION messages.
  #                Limited by the available resources of the host computer.
  #                Can not be faster than the simulation frequency.
  #   Units:       hertz
  #   Range:       [0, inf)
  #   Default:     0
  quaternion_rate: 0

  #   Description: The system ID of the system that's accepting HIL_STATE_QUATERNION messages.
  #   Range:       [1, inf)
  #   Default:     2
  quaternion_sys_id: 2

  #   Description: Component ID for the simulator on the 'quaternion_sys_id' system.
  #   Range:       [1, inf)
  #   Default:     3
  quaternion_comp_id: 3

  #   Description: The rate at which to send HIL_SENSOR MAVLink messages to a running PX4 instance.
  #                 If this is zero, the message will not be sent.
  #   Units:       hz
  #   Range:       [0, inf)
  #   Default:     125
  hil_sensor_rate: 125

  #   Description: The rate at which to send HIL_GPS MAVLink messages to a running PX4 instance.
  #                If this is zero, the message will not be sent.
  #   Units:       hz
  #   Range:       [0, inf)
  #   Default:     15
  hil_gps_rate: 15

##################
# section: weather
##################
weather:
  #   Description: Level of turbulence generated by the wind model
  #   Range:       [LIGHT, MODERATE, SEVERE]
  #   Default:     LIGHT
  turbulence: "LIGHT"

  #   Description: Speed of the generated wind
  #   Units:       m/s
  #   Range:       [0.0, inf)
  #   Default:     5.0
  wind_speed: 5.0

  #   Description: Direction of the generated wind
  #   Units:       rad
  #   Range:       [-2*pi, 2*pi]
  #   Default:     0.0
  wind_direction: 0.0

  #   Description: Air temperature in Celsius
  #   Units:       degrees celcius
  #   Range:       (-inf, inf)
  #   Default:     15.0
  temperature: 15.0